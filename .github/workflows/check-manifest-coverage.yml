name: Repo consistency checks

# Two declarations are easy to break silently: a file under a distributed
# directory that is missing from manifest.json (invisible to every onboarded
# workspace), and workflow/*.json drifting out of agreement (nothing executes
# that metadata, so nothing notices). update-manifest.yml only rehashes files
# already declared, so it cannot catch the first. See the checks for detail.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-manifest-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1

      - name: Use the collaboration service's existing Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - name: Every distributed file is declared in the manifest
        run: python3 scripts/check-manifest-coverage.py

      - name: Workflow metadata and generator version are consistent
        run: python3 scripts/check-workflow.py
