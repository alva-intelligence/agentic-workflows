<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#9c36b5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#2f9e44"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="550" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">frndOS Orchestrator Architecture</text>
  <text x="550" y="48" text-anchor="middle" font-size="12" fill="#757575">one orchestrator · parallel subagents · intercom · visual verification</text>

  <!-- Orchestration zone -->
  <rect x="180" y="60" width="590" height="90" rx="12" fill="#e5dbff" stroke="#9c36b5" stroke-width="1" opacity="0.35"/>
  <text x="192" y="74" font-size="10" fill="#7048a0" font-weight="600">ORCHESTRATOR (the running agent — no agent files)</text>

  <!-- Developer -->
  <rect x="25" y="80" width="140" height="44" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="95" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">Developer</text>
  <line x1="165" y1="100" x2="215" y2="100" stroke="#f08c00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="93" text-anchor="middle" font-size="10" fill="#946100">command</text>

  <!-- Orchestrator -->
  <rect x="220" y="82" width="530" height="56" rx="10" fill="#d0bfff" stroke="#9c36b5" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1e1e">Orchestrator</text>
  <text x="485" y="124" text-anchor="middle" font-size="11" fill="#3b3b3b">verify user claims · research · plan · delegate · verify everything</text>

  <!-- Lark CLI (read-only) -->
  <rect x="815" y="68" width="160" height="60" rx="10" fill="#c3fae8" stroke="#2f9e44" stroke-width="2" filter="url(#shadow)"/>
  <text x="895" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Lark CLI</text>
  <text x="895" y="110" text-anchor="middle" font-size="10" fill="#15803d">read pasted links · read-only</text>
  <line x1="815" y1="98" x2="755" y2="98" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-green)"/>

  <!-- Delegation arrows -->
  <line x1="290" y1="138" x2="130" y2="195" stroke="#9c36b5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <line x1="350" y1="138" x2="345" y2="195" stroke="#9c36b5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <line x1="420" y1="138" x2="560" y2="195" stroke="#9c36b5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <line x1="500" y1="138" x2="775" y2="195" stroke="#9c36b5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <line x1="560" y1="138" x2="990" y2="195" stroke="#9c36b5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>

  <!-- Sub-Agent zone -->
  <rect x="15" y="165" width="1075" height="110" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1" opacity="0.3"/>
  <text x="27" y="178" font-size="10" fill="#15803d" font-weight="600">SUBAGENT LAYER (spawned per batch — batched in ONE call, dependency edges only when needed)</text>

  <rect x="22" y="192" width="150" height="40" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" filter="url(#shadow)"/>
  <text x="97" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">subagent: api</text>
  <text x="97" y="244" text-anchor="middle" font-size="9" fill="#757575">implement + verify</text>

  <rect x="185" y="192" width="150" height="40" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">subagent: web</text>
  <text x="260" y="244" text-anchor="middle" font-size="9" fill="#757575">implement + self-test UI</text>

  <rect x="348" y="192" width="150" height="40" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" filter="url(#shadow)"/>
  <text x="423" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">subagent: data-service</text>
  <text x="423" y="244" text-anchor="middle" font-size="9" fill="#757575">implement + verify</text>

  <rect x="511" y="192" width="150" height="40" rx="8" fill="#99e9f2" stroke="#0c8599" stroke-width="2" filter="url(#shadow)"/>
  <text x="586" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">subagent: reviewer</text>
  <text x="586" y="244" text-anchor="middle" font-size="9" fill="#757575">fresh-eyes diff review</text>

  <rect x="674" y="192" width="150" height="40" rx="8" fill="#99e9f2" stroke="#0c8599" stroke-width="2" filter="url(#shadow)"/>
  <text x="749" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">subagent: research</text>
  <text x="749" y="244" text-anchor="middle" font-size="9" fill="#757575">external SDK/API facts</text>

  <rect x="837" y="192" width="150" height="40" rx="8" fill="#ffd8a8" stroke="#f08c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="912" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">right model + effort</text>
  <text x="912" y="244" text-anchor="middle" font-size="9" fill="#757575">per task, if harness allows</text>

  <text x="1063" y="216" font-size="10" fill="#15803d">⇄ intercom:</text>
  <text x="1063" y="230" font-size="9" fill="#15803d">steer / answer</text>
  <text x="1063" y="242" font-size="9" fill="#15803d">+ sibling links</text>

  <!-- Skills zone -->
  <rect x="15" y="295" width="1075" height="68" rx="12" fill="#dbe4ff" stroke="#1971c2" stroke-width="1" opacity="0.3"/>
  <text x="27" y="308" font-size="10" fill="#2563eb" font-weight="600">SKILLS LAYER (9 skills)</text>

  <rect x="22" y="318" width="90" height="28" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="67" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">/onboard</text>
  <rect x="120" y="318" width="90" height="28" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="165" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">/workflow</text>
  <rect x="218" y="318" width="65" height="28" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="250" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">/prd</text>
  <rect x="291" y="318" width="90" height="28" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="336" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">/prd-split</text>
  <rect x="389" y="318" width="95" height="28" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="436" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">/brainstorm</text>
  <rect x="492" y="318" width="105" height="28" rx="6" fill="#c3fae8" stroke="#2f9e44" stroke-width="1"/>
  <text x="544" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">/visual-testing</text>
  <rect x="605" y="318" width="130" height="28" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="670" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">/setup-workspace</text>
  <rect x="743" y="318" width="130" height="28" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="808" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">/workflow-update</text>
  <rect x="881" y="318" width="115" height="28" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="938" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">/pr-feedback</text>

  <!-- Tools zone -->
  <rect x="15" y="382" width="1075" height="52" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="1" opacity="0.3"/>
  <text x="27" y="395" font-size="10" fill="#946100" font-weight="600">SUPPORTED TOOLS</text>
  <rect x="25" y="405" width="110" height="22" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/>
  <text x="80" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">Claude Code</text>
  <rect x="145" y="405" width="80" height="22" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/>
  <text x="185" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">Cursor</text>
  <rect x="235" y="405" width="90" height="22" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/>
  <text x="280" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">OpenCode</text>
  <rect x="335" y="405" width="55" height="22" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/>
  <text x="362" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1e1e">Amp</text>
</svg>
