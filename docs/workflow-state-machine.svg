<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#444"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#999"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#f08c00"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#2f9e44"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="560" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1e1e">frndOS Three-Checkpoint Workflow</text>
  <text x="560" y="51" text-anchor="middle" font-size="12" fill="#757575">scope → automatic preparation → implementation → delivery · phase_status never crosses a checkpoint</text>

  <!-- Automatic preparation panel -->
  <rect x="320" y="96" width="390" height="104" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1" opacity="0.35"/>
  <text x="522" y="110" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">AUTOMATIC PREPARATION AFTER SCOPE APPROVAL</text>

  <!-- Row 1: Idle → Brainstorming → PRD Creation → PRD Splitting → Implementation -->
  <rect x="20" y="120" width="80" height="56" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1e1e">Idle</text>

  <rect x="130" y="120" width="180" height="56" rx="10" fill="#a5d8ff" stroke="#e8590c" stroke-width="3" filter="url(#shadow)"/>
  <text x="220" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">1 · Brainstorming</text>
  <text x="220" y="157" text-anchor="middle" font-size="9" font-weight="700" fill="#e8590c">SCOPE CHECKPOINT</text>
  <text x="220" y="170" text-anchor="middle" font-size="8.5" fill="#555">direction · decisions · summary</text>

  <rect x="350" y="120" width="150" height="56" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e1e1e">2 · PRD Creation</text>
  <text x="425" y="157" text-anchor="middle" font-size="9" fill="#555">features only · preparation</text>
  <text x="425" y="170" text-anchor="middle" font-size="8.5" fill="#777">no per-document approval</text>

  <rect x="540" y="120" width="150" height="56" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e1e1e">3 · PRD Splitting</text>
  <text x="615" y="157" text-anchor="middle" font-size="9" fill="#555">branch + service PRDs</text>
  <text x="615" y="170" text-anchor="middle" font-size="8.5" fill="#777">tracks · plans · verification plans</text>

  <rect x="730" y="120" width="180" height="56" rx="10" fill="#b2f2bb" stroke="#e8590c" stroke-width="3" filter="url(#shadow)"/>
  <text x="820" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">4 · Implementation</text>
  <text x="820" y="157" text-anchor="middle" font-size="9" font-weight="700" fill="#e8590c">IMPLEMENTATION CHECKPOINT</text>
  <text x="820" y="170" text-anchor="middle" font-size="8.5" fill="#555">code work · independent verification</text>

  <!-- Row 1 edges -->
  <line x1="100" y1="148" x2="130" y2="148" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="148" x2="350" y2="148" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="148" x2="540" y2="148" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="148" x2="730" y2="148" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Implementation → Delivery -->
  <line x1="820" y1="176" x2="820" y2="320" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="832" y="238" font-size="9" fill="#555">after independent</text>
  <text x="832" y="251" font-size="9" fill="#555">evidence + review</text>

  <!-- Bug / improvement: brainstorming → implementation, never PR submission -->
  <path d="M 220 176 L 220 230 Q 220 240 230 240 L 745 240 Q 755 240 755 230 L 755 176" fill="none" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-green)"/>
  <text x="470" y="232" text-anchor="middle" font-size="9" fill="#2f9e44" font-style="italic">bug / improvement → implementation only · no PRD phases</text>

  <!-- Row 2: PR Submission → PR Review → Completion -->
  <rect x="730" y="320" width="180" height="56" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="3" filter="url(#shadow)"/>
  <text x="820" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">5 · PR Submission</text>
  <text x="820" y="357" text-anchor="middle" font-size="9" font-weight="700" fill="#e8590c">DELIVERY CHECKPOINT</text>
  <text x="820" y="370" text-anchor="middle" font-size="8.5" fill="#555">local_test · open_pr · auto_merge</text>

  <rect x="540" y="320" width="150" height="56" rx="10" fill="#ffd8a8" stroke="#f08c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="340" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e1e1e">6 · PR Review</text>
  <text x="615" y="357" text-anchor="middle" font-size="9" fill="#555">conditional · feedback only</text>
  <text x="615" y="370" text-anchor="middle" font-size="8.5" fill="#777">paginated thread inventory</text>

  <rect x="350" y="320" width="150" height="56" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="340" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e1e1e">7 · Completion</text>
  <text x="425" y="357" text-anchor="middle" font-size="9" fill="#555">merged · cleanup</text>
  <text x="425" y="370" text-anchor="middle" font-size="8.5" fill="#777">production remains separate</text>

  <line x1="730" y1="348" x2="690" y2="348" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="340" text-anchor="middle" font-size="8.5" fill="#555">feedback</text>
  <line x1="540" y1="348" x2="500" y2="348" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="340" text-anchor="middle" font-size="8.5" fill="#555">resolved</text>

  <!-- Clean merge skips PR review -->
  <path d="M 820 376 L 820 430 Q 820 440 810 440 L 435 440 Q 425 440 425 430 L 425 376" fill="none" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-orange)"/>
  <text x="630" y="432" text-anchor="middle" font-size="9" fill="#f08c00" font-style="italic">merged clean · no feedback (conditional)</text>

  <!-- Completion back to Idle -->
  <path d="M 350 376 L 350 490 Q 350 500 340 500 L 70 500 Q 60 500 60 490 L 60 176" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-gray)"/>
  <text x="200" y="492" text-anchor="middle" font-size="9" fill="#999" font-style="italic">back to Idle</text>

  <!-- local_test keeps PR submission pending -->
  <path d="M 910 340 C 950 320 980 330 980 348 C 980 366 950 376 910 366" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/>
  <text x="988" y="330" font-size="8.5" fill="#e8590c" font-weight="600">local_test</text>
  <text x="988" y="343" font-size="8.5" fill="#e8590c">test locally first</text>
  <text x="988" y="356" font-size="8.5" fill="#e8590c">no PR · stays pending</text>

  <!-- Legend -->
  <text x="30" y="540" font-size="11" font-weight="600" fill="#1e1e1e">Legend</text>
  <rect x="30" y="550" width="12" height="12" rx="2" fill="#e9ecef" stroke="#868e96" stroke-width="1"/>
  <text x="48" y="560" font-size="9.5" fill="#555">Backlog</text>
  <rect x="112" y="550" width="12" height="12" rx="2" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="130" y="560" font-size="9.5" fill="#555">Plan</text>
  <rect x="174" y="550" width="12" height="12" rx="2" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1"/>
  <text x="192" y="560" font-size="9.5" fill="#555">Build / preparation</text>
  <rect x="300" y="550" width="12" height="12" rx="2" fill="#ffd8a8" stroke="#f08c00" stroke-width="1"/>
  <text x="318" y="560" font-size="9.5" fill="#555">Delivery / review</text>
  <rect x="424" y="550" width="12" height="12" rx="2" fill="#ffc9c9" stroke="#e03131" stroke-width="1"/>
  <text x="442" y="560" font-size="9.5" fill="#555">Done</text>
  <rect x="498" y="550" width="12" height="12" rx="2" fill="#a5d8ff" stroke="#e8590c" stroke-width="3"/>
  <text x="516" y="560" font-size="9.5" fill="#555">Human checkpoint (thick orange border)</text>

  <line x1="30" y1="582" x2="70" y2="582" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="78" y="586" font-size="9.5" fill="#2f9e44">automatic preparation</text>
  <line x1="235" y1="582" x2="275" y2="582" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="283" y="586" font-size="9.5" fill="#f08c00">conditional / clean merge</text>
  <line x1="470" y1="582" x2="510" y2="582" stroke="#999" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="518" y="586" font-size="9.5" fill="#999">return to Idle</text>

  <text x="30" y="610" font-size="9.5" fill="#444">Three human checkpoints: scope · implementation · delivery. phase_status is evidence only and never crosses one. No implementation → completion shortcut.</text>
  <text x="30" y="627" font-size="9" fill="#666">Delivery: local_test stays pending · open_pr opens then stops (feedback fixes need a separate request) · auto_merge is explicit per task + bounded watch, pinned head SHA; data-pipeline needs separate live_merge_approved.</text>
</svg>
