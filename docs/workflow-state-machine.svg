<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#444"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#999"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#f08c00"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#2f9e44"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1e">frndOS Workflow State Machine</text>
  <text x="500" y="48" text-anchor="middle" font-size="12" fill="#757575">8 phases · 5 kanban lanes · gate enforcement · Agent Teams shortcut</text>

  <!-- Row 1 (left to right) -->
  <rect x="10" y="72" width="90" height="44" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2" filter="url(#shadow)"/>
  <text x="55" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">Idle</text>
  <line x1="100" y1="94" x2="120" y2="94" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="125" y="72" width="160" height="44" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" filter="url(#shadow)"/>
  <text x="205" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1e1e">1. Brainstorming</text>
  <text x="205" y="130" text-anchor="middle" font-size="10" fill="#757575">frndos-brainstorm</text>
  <line x1="285" y1="94" x2="305" y2="94" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="72" width="150" height="44" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1e1e">2. PRD Creation</text>
  <text x="385" y="130" text-anchor="middle" font-size="10" fill="#757575">frndos-prd</text>
  <line x1="460" y1="94" x2="480" y2="94" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="485" y="72" width="150" height="44" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1e1e">3. PRD Splitting</text>
  <text x="560" y="130" text-anchor="middle" font-size="10" fill="#757575">frndos-splitter</text>
  <line x1="635" y1="94" x2="655" y2="94" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="72" width="180" height="44" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1e1e">4. Implementation</text>
  <text x="750" y="130" text-anchor="middle" font-size="10" fill="#757575">frndos-implement / teams</text>

  <!-- Implementation -> PR Submission -->
  <line x1="820" y1="116" x2="820" y2="195" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent Teams shortcut (dashed green: implementation -> completion) -->
  <path d="M 690 116 L 690 150 Q 690 160 680 160 L 372 160 Q 362 160 362 170 L 362 195" fill="none" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-green)"/>
  <text x="525" y="154" text-anchor="middle" font-size="10" fill="#2f9e44" font-style="italic">Agent Teams</text>

  <!-- Row 2 (right to left) -->
  <rect x="660" y="200" width="180" height="44" rx="10" fill="#ffd8a8" stroke="#f08c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1e1e">5. PR Submission</text>
  <text x="750" y="258" text-anchor="middle" font-size="10" fill="#757575">frndos-pr</text>
  <line x1="660" y1="222" x2="640" y2="222" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="475" y="200" width="165" height="44" rx="10" fill="#ffd8a8" stroke="#f08c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="557" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1e1e">6. PR Review</text>
  <text x="557" y="258" text-anchor="middle" font-size="10" fill="#757575">frndos-pr-review</text>
  <line x1="475" y1="222" x2="455" y2="222" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="285" y="200" width="165" height="44" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2" filter="url(#shadow)"/>
  <text x="367" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1e1e">7. Completion</text>
  <text x="367" y="258" text-anchor="middle" font-size="10" fill="#757575">frndos-track</text>

  <!-- Skip PR review (dashed orange: pr_submission -> completion) -->
  <path d="M 780 244 L 780 285 Q 780 295 770 295 L 420 295 Q 410 295 410 285 L 410 246" fill="none" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-orange)"/>
  <text x="595" y="290" text-anchor="middle" font-size="10" fill="#f08c00" font-style="italic">skip PR review</text>

  <!-- Back to idle -->
  <path d="M 285 222 L 70 222 Q 55 222 55 207 L 55 118" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-gray)"/>
  <text x="170" y="240" text-anchor="middle" font-size="10" fill="#999" font-style="italic">back to Idle</text>

  <!-- Legend -->
  <text x="30" y="332" font-size="12" font-weight="600" fill="#1e1e1e">Kanban lanes</text>
  <rect x="30" y="344" width="12" height="12" rx="2" fill="#e9ecef" stroke="#868e96" stroke-width="1"/>
  <text x="48" y="355" font-size="11" fill="#757575">Backlog</text>
  <rect x="105" y="344" width="12" height="12" rx="2" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="123" y="355" font-size="11" fill="#757575">Plan</text>
  <rect x="165" y="344" width="12" height="12" rx="2" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1"/>
  <text x="183" y="355" font-size="11" fill="#757575">Build</text>
  <rect x="225" y="344" width="12" height="12" rx="2" fill="#ffd8a8" stroke="#f08c00" stroke-width="1"/>
  <text x="243" y="355" font-size="11" fill="#757575">Review</text>
  <rect x="295" y="344" width="12" height="12" rx="2" fill="#ffc9c9" stroke="#e03131" stroke-width="1"/>
  <text x="313" y="355" font-size="11" fill="#757575">Done</text>

  <line x1="390" y1="350" x2="440" y2="350" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="446" y="355" font-size="11" fill="#f08c00">skip PR review (submission → completion)</text>
  <line x1="700" y1="350" x2="750" y2="350" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="756" y="355" font-size="11" fill="#2f9e44">Agent Teams (impl → completion)</text>
</svg>
